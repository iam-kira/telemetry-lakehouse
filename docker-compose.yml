# telemetry-lakehouse — Phase 1 stack. Brought up one layer at a time.
# Every service shares the default compose network and is reachable by service name.
name: telemetry-lakehouse

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: tl-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped

  # Single-node Kafka in KRaft mode: one process is both controller and broker,
  # no ZooKeeper. Two client listeners:
  #   INTERNAL (kafka:9092)      — for other containers (bridge, connect)
  #   EXTERNAL (localhost:29092) — for tools on the host (dev python, CLI)
  kafka:
    image: apache/kafka:3.9.0
    container_name: tl-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # MQTT -> Kafka bridge: subscribes sensors/#, republishes to the `telemetry`
  # topic keyed by device_id. Reachable services by name on the compose network.
  bridge:
    build: ./bridge
    container_name: tl-bridge
    depends_on:
      - mosquitto
      - kafka
    environment:
      MQTT_HOST: mosquitto
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: telemetry
    restart: unless-stopped

volumes:
  mqtt-data:
  kafka-data:
