# telemetry-lakehouse — Phase 1 stack. Brought up one layer at a time.
# Every service shares the default compose network and is reachable by service name.
name: telemetry-lakehouse

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: tl-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data
    restart: unless-stopped

  # Single-node Kafka in KRaft mode: one process is both controller and broker,
  # no ZooKeeper. Two client listeners:
  #   INTERNAL (kafka:9092)      — for other containers (bridge, connect)
  #   EXTERNAL (localhost:29092) — for tools on the host (dev python, CLI)
  kafka:
    image: apache/kafka:3.9.0
    container_name: tl-kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # MQTT -> Kafka bridge: subscribes sensors/#, republishes to the `telemetry`
  # topic keyed by device_id. Reachable services by name on the compose network.
  bridge:
    build: ./bridge
    container_name: tl-bridge
    depends_on:
      - mosquitto
      - kafka
    environment:
      MQTT_HOST: mosquitto
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: telemetry
    restart: unless-stopped

  # S3-compatible object store — where Iceberg data + metadata files live.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: tl-minio
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  # One-shot: create the `warehouse` bucket, then exit.
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: tl-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 admin password; do sleep 1; done;
      mc mb --ignore-existing local/warehouse;
      echo 'bucket ready'; "

  # Iceberg REST catalog — tracks table metadata; points data at MinIO.
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.2
    container_name: tl-iceberg-rest
    ports:
      - "8181:8181"
    depends_on:
      - minio
    environment:
      CATALOG_WAREHOUSE: s3://warehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    restart: unless-stopped

  # Kafka -> Iceberg sink (PyIceberg micro-batching). Writes data files straight
  # to MinIO, so it needs both the catalog URI and S3 credentials.
  sink:
    build: ./sink
    container_name: tl-sink
    depends_on:
      - kafka
      - iceberg-rest
      - minio
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_TOPIC: telemetry
      CATALOG_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
      BATCH_SIZE: "50"
      FLUSH_SECONDS: "5"
    restart: unless-stopped

  # Device registry. wal_level=logical lets Debezium read the write-ahead log.
  postgres:
    image: postgres:16
    container_name: tl-postgres
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: registry
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Kafka Connect running Debezium — reads the Postgres WAL and emits a CDC event
  # to Kafka for every insert/update/delete on the registry.
  connect:
    image: debezium/connect:3.0.0.Final
    container_name: tl-connect
    depends_on:
      - kafka
      - postgres
    ports:
      - "8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: cdc
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    restart: unless-stopped

  # CDC -> Iceberg: lands every registry change into coldchain.device_changes.
  registry-sink:
    build: ./sink
    image: telemetry-lakehouse-sink
    container_name: tl-registry-sink
    command: ["python", "-u", "registry_sink.py"]
    depends_on:
      - kafka
      - iceberg-rest
      - connect
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      CDC_TOPIC: cdc.public.devices
      CATALOG_URI: http://iceberg-rest:8181
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: password
      AWS_REGION: us-east-1
    restart: unless-stopped

volumes:
  mqtt-data:
  kafka-data:
  minio-data:
  pg-data:
